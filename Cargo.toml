[package]
name = "pseudo-harness"
version = "3.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
ratatui = "0.26"
crossterm = "0.27"

[dev-dependencies]
tempfile = "3.8"
tower = { version = "0.5", features = ["util"] }
